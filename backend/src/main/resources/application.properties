spring.application.name=ReflectOS

# ─── Database ──────────────────────────────────────────────────────
# All values can be overridden via environment variables for production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reflectos_db}
spring.datasource.username=${DB_USERNAME:reflectos_user}
spring.datasource.password=${DB_PASSWORD:reflectos_secure_pass_123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Flyway Migrations ────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ─── Security / JWT ───────────────────────────────────────────────
# Access tokens: 15 minutes. Refresh tokens: 7 days.
# The secret MUST be overridden via environment variable in production.
jwt.secret=${JWT_SECRET:8f7d3f2c9e7a1b8d5a6c4f2e8d9b1c7a5f3e2d1b8c9a4f6e7d2c1b8a5f3e9d7ca1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6}
jwt.expirationMs=${JWT_EXPIRATION_MS:900000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ─── Server ───────────────────────────────────────────────────────
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Dev Mode Auth ────────────────────────────────────────────────
# Set to false in production environments.
app.dev-mode-auth=${DEV_MODE_AUTH:true}

# ─── Actuator (Health, Info, Metrics, Prometheus) ─────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# ─── OpenAPI / Swagger (dev/staging only) ─────────────────────────
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# ─── Redis ────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:16379}
