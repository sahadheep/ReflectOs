version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reflectos_db
    environment:
      POSTGRES_USER: reflectos_user
      POSTGRES_PASSWORD: reflectos_password
      POSTGRES_DB: reflectos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
